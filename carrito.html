<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi carrito | Angel's Fashion World</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #ffffff 0%, transparent 35%),
                radial-gradient(circle at bottom right, #ffe1ef 0%, transparent 40%),
                #fff0f6;
            color: #6b4055;
            min-height: 100vh;
        }

        /* ESTRELLAS */

        .estrella {
            position: fixed;
            color: #d85b91;
            font-size: 22px;
            z-index: 0;
            animation: flotar 4s ease-in-out infinite;
        }

        .estrella1 {
            top: 12%;
            left: 5%;
        }

        .estrella2 {
            top: 25%;
            right: 7%;
            animation-delay: 1s;
        }

        .estrella3 {
            bottom: 20%;
            left: 8%;
            animation-delay: 2s;
        }

        .estrella4 {
            bottom: 10%;
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes flotar {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* MENÚ */

        .menu {
            width: 92%;
            max-width: 1200px;
            margin: 25px auto;
            padding: 15px 20px;

            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #f2c8da;
            border-radius: 25px;

            box-shadow: 0 5px 20px rgba(216, 91, 145, 0.12);

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;

            position: relative;
            z-index: 2;
        }

        .menu a {
            text-decoration: none;
            color: #6b4055;
            font-weight: bold;
            transition: 0.3s;
        }

        .menu a:hover {
            color: #d85b91;
        }

        /* PRESENTACIÓN */

        .presentacion {
            width: 92%;
            max-width: 1000px;
            margin: 30px auto;
            padding: 35px 20px;
            text-align: center;

            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #f2c8da;
            border-radius: 25px;

            box-shadow: 0 5px 20px rgba(216, 91, 145, 0.12);

            position: relative;
            z-index: 1;
        }

        .alas {
            font-size: 35px;
            margin-bottom: 5px;
        }

        .presentacion h1 {
            color: #d85b91;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .presentacion p {
            font-size: 17px;
            margin-bottom: 20px;
        }

        .volver {
            display: inline-block;
            background: #d85b91;
            color: white;
            padding: 12px 22px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .volver:hover {
            transform: scale(1.04);
        }

        /* CARRITO */

        .carrito-contenedor {
            width: 92%;
            max-width: 1000px;
            margin: 30px auto 60px;
            position: relative;
            z-index: 1;
        }

        .titulo-carrito {
            text-align: center;
            color: #d85b91;
            font-size: 30px;
            margin-bottom: 25px;
        }

        .producto-carrito {
            background: white;
            border: 1px solid #f2c8da;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;

            box-shadow: 0 5px 18px rgba(216, 91, 145, 0.10);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .producto-info {
            flex: 1;
            min-width: 220px;
        }

        .producto-info h3 {
            color: #d85b91;
            margin-bottom: 8px;
            font-size: 19px;
        }

        .producto-info p {
            margin: 4px 0;
        }

        .cantidad {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cantidad button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: #d85b91;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .cantidad span {
            font-weight: bold;
            min-width: 25px;
            text-align: center;
        }

        .eliminar {
            border: none;
            background: #ffe1ef;
            color: #d85b91;
            padding: 9px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        /* RESUMEN */

        .resumen {
            background: white;
            border: 1px solid #f2c8da;
            border-radius: 25px;
            padding: 25px;
            margin-top: 25px;

            box-shadow: 0 5px 20px rgba(216, 91, 145, 0.12);
        }

        .resumen h2 {
            color: #d85b91;
            margin-bottom: 18px;
            font-size: 25px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 21px;
            font-weight: bold;

            padding: 15px 0;

            border-top: 1px solid #f2c8da;
        }

        .total span:last-child {
            color: #d85b91;
        }

        /* BOTONES */

        .acciones {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .vaciar {
            background: white;
            color: #d85b91;

            border: 2px solid #d85b91;

            padding: 12px 20px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: bold;
        }

        .comprar {
            background: #d85b91;
            color: white;

            border: none;

            padding: 13px 30px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: bold;
            font-size: 16px;
        }

        /* CARRITO VACÍO */

        .vacio {
            background: white;

            border: 1px solid #f2c8da;

            border-radius: 25px;

            padding: 40px 20px;

            text-align: center;

            box-shadow: 0 5px 20px rgba(216, 91, 145, 0.12);
        }

        .vacio h2 {
            color: #d85b91;
            margin-bottom: 12px;
        }

        .vacio p {
            margin-bottom: 20px;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 30px 15px;
            color: #6b4055;

            position: relative;
            z-index: 1;
        }

        footer strong {
            color: #d85b91;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            .menu {
                gap: 12px;
                padding: 14px;
            }

            .menu a {
                font-size: 14px;
            }

            .presentacion h1 {
                font-size: 28px;
            }

            .producto-carrito {
                align-items: flex-start;
            }

            .acciones {
                flex-direction: column;
                align-items: stretch;
            }

            .vaciar,
            .comprar {
                width: 100%;
            }

            .total {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- ESTRELLAS -->

    <div class="estrella estrella1">✦</div>
    <div class="estrella estrella2">✧</div>
    <div class="estrella estrella3">✦</div>
    <div class="estrella estrella4">✧</div>


    <!-- MENÚ -->

    <nav class="menu">

        <a href="index.html">
            Inicio
        </a>

        <a href="moda.html">
            Moda
        </a>

        <a href="belleza.html">
            Belleza
        </a>

        <a href="skincare.html">
            Skin care
        </a>

        <a href="accesorios.html">
            Accesorios
        </a>

        <a href="sobre-nosotros.html">
            Sobre nosotros
        </a>

        <a href="index.html#contactanos">
            Contáctanos
        </a>

    </nav>


    <!-- PRESENTACIÓN -->

    <header class="presentacion">

        <div class="alas">
            🪽 ✦
        </div>

        <h1>
            Mi carrito 🛒
        </h1>

        <p>
            Revisa tus productos antes de comprar. 💕
        </p>

        <a
            href="index.html"
            class="volver">

            ← Seguir comprando

        </a>

    </header>


    <!-- CARRITO -->

    <main class="carrito-contenedor">

        <h2 class="titulo-carrito">
            Resumen de carrito
        </h2>


        <div id="listaCarrito"></div>


        <!-- RESUMEN -->

        <section
            class="resumen"
            id="resumenCarrito">

            <h2>
                Resumen de carrito 🛍️
            </h2>


            <div class="total">

                <span>
                    Total:
                </span>

                <span id="totalCarrito">
                    $0
                </span>

            </div>


            <div class="acciones">

                <!-- IZQUIERDA -->

                <button
                    class="vaciar"
                    onclick="vaciarCarrito()">

                    Vaciar carrito

                </button>


                <!-- DERECHA -->

                <button
                    class="comprar"
                    onclick="irAPagar()">

                    Comprar

                </button>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        🪽
        <strong>
            Angel's Fashion World
        </strong>
        🪽

        <br>

        Moda • Belleza • Skin Care • Accesorios

    </footer>


    <script>

        /*
        ========================================
        CARRITO
        ========================================
        */
let carrito =
            JSON.parse(
                localStorage.getItem("carritoAngel")
            ) || [];


        /*
        ========================================
        FORMATO DE PRECIO
        ========================================
        */

        function formatoPrecio(numero) {

            numero = Number(numero) || 0;

            return "$" + numero.toLocaleString("es-CO");

        }


        /*
        ========================================
        GUARDAR CARRITO
        ========================================
        */

        function guardarCarrito() {

            localStorage.setItem(
                "carritoAngel",
                JSON.stringify(carrito)
            );

            mostrarCarrito();

        }


        /*
        ========================================
        MOSTRAR CARRITO
        ========================================
        */

        function mostrarCarrito() {

            const lista =
                document.getElementById("listaCarrito");

            const resumen =
                document.getElementById("resumenCarrito");


            lista.innerHTML = "";


            /*
            CARRITO VACÍO
            */

            if (
                !Array.isArray(carrito) ||
                carrito.length === 0
            ) {

                lista.innerHTML = `

                    <div class="vacio">

                        <h2>
                            Tu carrito está vacío 🛒
                        </h2>

                        <p>
                            Todavía no has agregado ningún producto. 💕
                        </p>

                        <a
                            href="index.html"
                            class="volver">

                            Explorar Angel's 🪽

                        </a>

                    </div>

                `;

                resumen.style.display = "none";

                return;
            }


            resumen.style.display = "block";


            let total = 0;


            /*
            PRODUCTOS
            */

            carrito.forEach(
                (producto, index) => {

                    const precio =
                        Number(producto.precio) || 0;

                    const cantidad =
                        Number(producto.cantidad) || 1;


                    total +=
                        precio * cantidad;


                    lista.innerHTML += `

                        <div class="producto-carrito">

                            <div class="producto-info">

                                <h3>
                                    ${producto.nombre || "Producto"}
                                </h3>

                                <p>
                                    Precio:
                                    ${formatoPrecio(precio)}
                                </p>

                                ${
                                    producto.talla
                                    ?
                                    `<p>
                                        Talla:
                                        ${producto.talla}
                                    </p>`
                                    :
                                    ""
                                }

                            </div>


                            <div class="cantidad">

                                <button
                                    onclick="disminuirCantidad(${index})">

                                    −

                                </button>


                                <span>
                                    ${cantidad}
                                </span>


                                <button
                                    onclick="aumentarCantidad(${index})">

                                    +

                                </button>

                            </div>


                            <button
                                class="eliminar"
                                onclick="eliminarProducto(${index})">

                                Eliminar

                            </button>

                        </div>

                    `;
                }
            );


            document.getElementById(
                "totalCarrito"
            ).textContent =
                formatoPrecio(total);

        }


        /*
        ========================================
        AUMENTAR CANTIDAD
        ========================================
        */

        function aumentarCantidad(index) {

            carrito[index].cantidad =
                (Number(
                    carrito[index].cantidad
                ) || 0) + 1;


            guardarCarrito();

        }


        /*
        ========================================
        DISMINUIR CANTIDAD
        ========================================
        */

        function disminuirCantidad(index) {

            const cantidad =
                Number(
                    carrito[index].cantidad
                ) || 1;


            if (cantidad > 1) {

                carrito[index].cantidad =
                    cantidad - 1;

            } else {

                carrito.splice(index, 1);

            }


            guardarCarrito();

        }


        /*
        ========================================
        ELIMINAR
        ========================================
        */

        function eliminarProducto(index) {

            carrito.splice(index, 1);

            guardarCarrito();

        }


        /*
        ========================================
        VACIAR CARRITO
        ========================================
        */

        function vaciarCarrito() {

            if (carrito.length === 0) {
                return;
            }


            const confirmar =
                confirm(
                    "¿Quieres vaciar todo el carrito?"
                );


            if (confirmar) {

                carrito = [];


                localStorage.setItem(
                    "carritoAngel",
                    JSON.stringify(carrito)
                );


                mostrarCarrito();

            }

        }


        /*
        ========================================
        IR A PAGAR
        ========================================
        */

        function irAPagar() {

            window.location.href =
                "nequi.html";

        }


        /*
        ========================================
        INICIAR
        ========================================
        */

        mostrarCarrito();

    </script>

</body>

</html>
