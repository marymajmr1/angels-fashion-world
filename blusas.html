<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff1f7">
  <title>Blusas | Angel's Fashion World</title>

  <style>
    :root {
      --rosa: #df4f8e;
      --rosa-oscuro: #a52f68;
      --rosa-intenso: #c92f75;
      --texto: #68495a;
      --dorado: #c8a96b;
      --borde: #f4cfe0;
      --fondo: #fff8fc;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 25px;
    }

    body {
      margin: 0;
      padding-bottom: 85px;
      font-family: Arial, sans-serif;
      color: var(--texto);
      background:
        radial-gradient(circle at top left, #ffe1ee, transparent 28%),
        radial-gradient(circle at 90% 30%, #fff0f7, transparent 25%),
        var(--fondo);
    }

    a { color: inherit; }

    .estrellas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      color: var(--dorado);
      opacity: .75;
    }

    .estrella {
      position: absolute;
      animation: flotar 5s ease-in-out infinite;
    }

    .estrella1 { top: 120px; left: 4%; }

    .estrella2 {
      top: 280px;
      right: 5%;
      animation-delay: .7s;
    }

    .estrella3 {
      bottom: 180px;
      left: 6%;
      animation-delay: 1.3s;
    }

    .estrella4 {
      bottom: 80px;
      right: 7%;
      animation-delay: 2s;
    }

    @keyframes flotar {
      50% { transform: translateY(-9px) rotate(8deg); }
    }

    .menu {
      position: relative;
      z-index: 2;
      width: 94%;
      max-width: 1200px;
      margin: 16px auto;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      border: 1px solid var(--borde);
      border-radius: 20px;
      background: #ffffffed;
      box-shadow: 0 5px 20px #d85b9112;
    }

    .menu a {
      padding: 10px 13px;
      border-radius: 25px;
      font-size: 13px;
      text-decoration: none;
      transition: .2s;
    }

    .menu a:hover,
    .menu a.activo {
      background: var(--rosa);
      color: white;
    }

    .volver-contenedor {
      margin: 0 0 10px;
    }

    .boton-volver {
      display: inline-block;
      padding: 11px 24px;
      border: 1px solid var(--rosa);
      border-radius: 25px;
      background: white;
      color: var(--rosa-oscuro);
      font-weight: bold;
      text-decoration: none;
      transition: .2s;
    }

    .boton-volver:hover {
      background: var(--rosa);
      color: white;
    }

    .portada {
      position: relative;
      z-index: 1;
      width: 92%;
      max-width: 1200px;
      min-height: 320px;
      margin: 25px auto 30px;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow: hidden;
      border: 1px solid var(--borde);
      border-radius: 28px;
      background: linear-gradient(135deg, #ffc5df, #ffdaea, #ffb9d5);
      box-shadow: 0 10px 30px #9a39670c;
    }

    .portada-texto {
      flex: 1;
      min-width: 0;
      padding: clamp(20px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
    }

    .portada img {
      display: block;
      flex: 1;
      width: 50%;
      min-width: 0;
      height: auto;
      min-height: 320px;
      max-height: 420px;
      object-fit: cover;
      object-position: center;
    }

    .mini {
      color: var(--dorado);
      font-size: 12px;
      letter-spacing: 2px;
    }

    .alas-con-estrella {
      margin-top: 15px;
      color: var(--dorado);
      font-size: 23px;
    }

    .alas {
      display: inline-block;
      animation: moverAlas 3s ease-in-out infinite;
    }

    @keyframes moverAlas {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .portada h1 {
      margin: 12px 0;
      color: var(--rosa-oscuro);
      font: 400 clamp(34px, 5vw, 58px)/1.1 Georgia, serif;
    }

    .portada h1 span {
      display: block;
      margin-top: 10px;
      font-size: .35em;
      letter-spacing: .2em;
    }

    .frase {
      margin: 5px 0;
      color: #9c5276;
      font: italic clamp(16px, 2vw, 22px) Georgia, serif;
      line-height: 1.5;
    }

    .boton-categoria {
      border: 1px solid var(--rosa) !important;
      border-radius: 30px;
      background: var(--rosa) !important;
      color: white !important;
      text-decoration: none;
      transition: .3s;
    }

    .boton-categoria:hover {
      background: var(--rosa-intenso) !important;
      border-color: var(--rosa-intenso) !important;
      transform: translateY(-2px);
      box-shadow: 0 7px 18px #c92f7540;
    }

    .adorno {
      margin-top: 16px;
      color: var(--dorado);
      letter-spacing: 7px;
    }

    .titulo-categorias {
      position: relative;
      z-index: 1;
      margin: 40px 15px 30px;
      text-align: center;
      scroll-margin-top: 20px;
    }

    .titulo-categorias h2 {
      margin: 12px 0;
      color: var(--rosa-oscuro);
      font: 400 clamp(28px, 4vw, 42px) Georgia, serif;
    }

    .titulo-categorias p { line-height: 1.7; }

    .categorias {
      position: relative;
      z-index: 1;
      width: 92%;
      max-width: 1200px;
      margin: 0 auto 45px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 25px;
    }

    .categoria {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--borde);
      border-radius: 23px;
      background: white;
      box-shadow: 0 7px 22px #d85b9112;
      text-align: center;
      transition: transform .25s, box-shadow .25s;
    }

    .categoria:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px #d85b9125;
    }

      display: block;
      width: 100%;
      height: 290px;
      object-fit: cover;
      background: #fff0f6;
      cursor: zoom-in
