<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi tienda</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
      background: #fff;
      padding-bottom: 76px;
    }
    .categorias {
      display: flex;
      gap: 28px;
      padding: 15px 20px;
      overflow-x: auto;
      white-space: nowrap;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .categorias a { color: #333; text-decoration: none; }
    main { max-width: 420px; margin: 48px auto; padding: 20px; }
    h1 { font-size: 24px; }
    label { display: block; margin: 16px 0 7px; font-size: 14px; }
    input {
      width: 100%; padding: 13px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 16px;
    }
    .campo-password { position: relative; }
    .campo-password input { padding-right: 48px; }
    .ojo {
      position: absolute; top: 50%; right: 10px;
      transform: translateY(-50%); border: 0; background: transparent;
      cursor: pointer; font-size: 18px;
    }
    .boton {
      width: 100%; margin-top: 22px; padding: 14px;
      border: 0; border-radius: 8px; background: #f43f5e;
      color: white; font-size: 16px; cursor: pointer;
    }
    .aviso { color: #666; font-size: 13px; line-height: 1.5; }
    .barra-inferior {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-around;
      padding: 9px 4px calc(9px + env(safe-area-inset-bottom));
      background: white; border-top: 1px solid #e8e8e8;
    }
    .barra-inferior a {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; min-width: 70px; color: #333;
      text-decoration: none; font-size: 12px;
    }
    .icono { font-size: 20px; }
  </style>
</head>
<body>
  <nav class="categorias" aria-label="Categorías">
    <a href="#moda">Moda</a>
    <a href="#belleza">Belleza</a>
    <a href="#skincare">Skincare</a>
    <a href="#accesorios">Accesorios</a>
  </nav>

  <main>
    <h1>Inicia sesión</h1>
    <form id="formulario">
      <label for="correo">Correo electrónico</label>
      <input id="correo" name="correo" type="email" autocomplete="email"
             placeholder="tu@correo.com" required>

      <label for="contrasena">Contraseña</label>
      <div class="campo-password">
        <input id="contrasena" name="contrasena" type="password"
               autocomplete="current-password" minlength="8" required>
        <button class="ojo" type="button" id="alternar" aria-label="Mostrar contraseña"
                aria-pressed="false">👁️</button>
      </div>

      <button class="boton" type="submit">Entrar</button>
      <p class="aviso">Usa una contraseña única. Nunca compartas tu contraseña por mensaje.</p>
    </form>
  </main>

  <nav class="barra-inferior" aria-label="Navegación principal">
    <a href="#perfil"><span class="icono">👤</span>Perfil</a>
    <a href="#pedidos"><span class="icono">📦</span>Mis pedidos</a>
    <a href="#carrito"><span class="icono">🛒</span>Mi carrito</a>
  </nav>

  <script>
    const contrasena = document.getElementById("contrasena");
    const alternar = document.getElementById("alternar");

    alternar.addEventListener("click", () => {
      const mostrar = contrasena.type === "password";
      contrasena.type = mostrar ? "text" : "password";
      alternar.setAttribute("aria-pressed", String(mostrar));
      alternar.setAttribute(
        "aria-label",
        mostrar ? "Ocultar contraseña" : "Mostrar contraseña"
      );
    });

    document.getElementById("formulario").addEventListener("submit", (evento) => {
      evento.preventDefault();
      alert("Maqueta de demostración: conecta el formulario a un servidor seguro.");
    });
  </script>
</body>
</html>
