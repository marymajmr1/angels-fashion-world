
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi tienda</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding-bottom: 80px;
      color: #222;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    .categorias {
      display: flex;
      gap: 28px;
      overflow-x: auto;
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }

    .categorias a {
      color: #333;
      text-decoration: none;
    }

    main {
      max-width: 420px;
      margin: 48px auto;
      padding: 20px;
    }

    h1 { font-size: 24px; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .campo-password { position: relative; }

    .campo-password input { padding-right: 52px; }

    .ojo {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      padding: 8px;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
    }

    .boton {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #f43f5e;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .aviso {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .barra-inferior {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-around;
      padding: 9px 4px calc(9px + env(safe-area-inset-bottom));
      border-top: 1px solid #e8e8e8;
      background: white;
    }

    .barra-inferior a {
      display: flex;
      min-width: 70px;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #333;
      font-size: 12px;
      text-decoration: none;
    }

    .icono { font-size: 20px; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <nav class="categorias" aria-label="Categorías">
    <a href="#moda">Moda</a>
    <a href="#belleza">Belleza</a>
    <a href="#skincare">Skincare</a>
    <a href="#accesorios">Accesorios</a>
  </nav>

  <main>
    <form id="formulario">
      <h1>Inicia sesión</h1>

      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        name="correo"
        type="email"
        autocomplete="email"
        placeholder="tu@correo.com"
        required
      >

      <label for="contrasena">Contraseña</label>
      <div class="campo-password">
        <input
          id="contrasena"
          name="contrasena"
          type="password"
          autocomplete="current-password"
          minlength="8"
          required
        >
        <button
          class="ojo"
          type="button"
          id="alternar"
          aria-label="Mostrar contraseña"
          aria-pressed="false"
        >👁️</button>
      </div>

      <button class="boton" type="submit">Entrar</button>
      <p class="aviso">
        Esta demostración no envía ni guarda tu correo o contraseña.
      </p>
    </form>

    <section id="bienvenida" hidden>
      <h1>¡Bienvenido/a!</h1>
      <p>Iniciaste en la maqueta de demostración.</p>
    </section>
  </main>

  <nav
    class="barra-inferior"
    id="barraInferior"
    aria-label="Navegación principal"
    hidden
  >
    <a href="#perfil"><span class="icono">👤</span>Perfil</a>
    <a href="#pedidos"><span class="icono">📦</span>Mis pedidos</a>
    <a href="#carrito"><span class="icono">🛒</span>Mi carrito</a>
  </nav>

  <script>
    const formulario = document.getElementById("formulario");
    const contrasena = document.getElementById("contrasena");
    const alternar = document.getElementById("alternar");

    alternar.addEventListener("click", () => {
      const mostrar = contrasena.type === "password";

      contrasena.type = mostrar ? "text" : "password";
      alternar.textContent = mostrar ? "🙈" : "👁️";
      alternar.setAttribute("aria-pressed", String(mostrar));
      alternar.setAttribute(
        "aria-label",
        mostrar ? "Ocultar contraseña" : "Mostrar contraseña"
      );
    });

    formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();

      if (!formulario.reportValidity()) return;

      formulario.hidden = true;
      document.getElementById("bienvenida").hidden = false;
      document.getElementById("barraInferior").hidden = false;
    });
  </script>
</body>
</html>
