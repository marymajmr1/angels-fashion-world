
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi tienda</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #222;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    [hidden] { display: none !important; }

    .categorias {
      display: flex;
      gap: 28px;
      overflow-x: auto;
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
      background: #fff;
      animation: aparecer 0.45s ease-out;
    }

    .categorias a {
      color: #333;
      text-decoration: none;
    }

    main {
      max-width: 420px;
      margin: 48px auto;
      padding: 20px;
    }

    h1 { font-size: 24px; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .campo-password { position: relative; }
    .campo-password input { padding-right: 48px; }

    .ojo {
      position: absolute;
      top: 50%;
      right: 8px;
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #555;
      cursor: pointer;
    }

    .ojo:hover { background: #f4f4f4; }
    .ojo svg { width: 21px; height: 21px; }

    .boton {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #f43f5e;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .aviso {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    #bienvenida {
      text-align: center;
      animation: aparecer 0.55s ease-out;
    }

    #bienvenida p { color: #666; }

    .barra-inferior {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-around;
      padding: 9px 4px calc(9px + env(safe-area-inset-bottom));
      border-top: 1px solid #e8e8e8;
      background: #fff;
      animation: aparecer 0.45s ease-out;
    }

    .barra-inferior a {
      display: flex;
      min-width: 70px;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #333;
      font-size: 12px;
      text-decoration: none;
    }

    .barra-inferior svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <nav class="categorias" id="categorias" aria-label="Categorías" hidden>
    <a href="#moda">Moda</a>
    <a href="#belleza">Belleza</a>
    <a href="#skincare">Skincare</a>
    <a href="#accesorios">Accesorios</a>
  </nav>

  <main>
    <form id="formulario">
      <h1>Inicia sesión</h1>

      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        name="correo"
        type="email"
        autocomplete="email"
        placeholder="tu@correo.com"
        required
      >

      <label for="contrasena">Contraseña</label>
      <div class="campo-password">
        <input
          id="contrasena"
          name="contrasena"
          type="password"
          autocomplete="current-password"
          minlength="8"
          required
        >

        <button
          class="ojo"
          type="button"
          id="alternar"
          aria-label="Mostrar contraseña"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              id="iconoOjo"
              d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <circle
              id="pupila"
              cx="12"
              cy="12"
              r="3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              id="rayaOjo"
              d="M4 20 20 4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              hidden
            />
          </svg>
        </button>
      </div>

      <button class="boton" type="submit">Entrar</button>
      <p class="aviso">
        Esta maqueta no envía ni guarda tu correo o contraseña.
      </p>
    </form>

    <section id="bienvenida" hidden>
      <h1>¡Qué bueno verte!</h1>
      <p>Ya puedes explorar la tienda.</p>
    </section>
  </main>

  <nav
    class="barra-inferior"
    id="barraInferior"
    aria-label="Navegación principal"
    hidden
  >
    <a href="#perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5"/>
        <path d="M5 20c.5-4 3-6 7-6s6.5 2 7 6"/>
      </svg>
      Perfil
    </a>

    <a href="#pedidos">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16v13H4z"/>
        <path d="M8 7V5h8v2M8 11h8M8 15h5"/>
      </svg>
      Mis pedidos
    </a>

    <a href="#carrito">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 4h2l2.2 11h10.9L21 8H6"/>
        <circle cx="9" cy="19" r="1.3"/>
        <circle cx="17" cy="19" r="1.3"/>
      </svg>
      Mi carrito
    </a>
  </nav>

  <script>
    const formulario = document.getElementById("formulario");
    const contrasena = document.getElementById("contrasena");
    const alternar = document.getElementById("alternar");
    const rayaOjo = document.getElementById("rayaOjo");

    alternar.addEventListener("click", () => {
      const mostrar = contrasena.type === "password";

      contrasena.type = mostrar ? "text" : "password";
      rayaOjo.hidden = !mostrar;
      alternar.setAttribute("aria-pressed", String(mostrar));
      alternar.setAttribute(
        "aria-label",
        mostrar ? "Ocultar contraseña" : "Mostrar contraseña"
      );
    });

    formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();

      if (!formulario.reportValidity()) return;

      formulario.hidden = true;
      document.getElementById("bienvenida").hidden = false;
      document.getElementById("categorias").hidden = false;
      document.getElementById("barraInferior").hidden = false;
      document.body.style.paddingBottom = "80px";
    });
  </script>
</body>
</html>
